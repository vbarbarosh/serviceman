<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{description}}">
<title>{{title}}</title>
<!-- Generated by bin/build-pages from the .md beside it and src/pages. Do not edit by hand: change those, then run bin/build-pages. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='3' width='22' height='26' rx='2' fill='none' stroke='%232743b8' stroke-width='3'/%3E%3Cpath d='M16 5v22' stroke='%232743b8' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<script>
    // the theme stamped before the first paint: the one picked here, else the system's
    (function () {
        let theme = null;
        try {
            theme = localStorage.getItem('serviceman-docs-theme');
        }
        catch (error) {
            theme = null;
        }
        document.documentElement.dataset.theme = ['light', 'dark'].includes(theme) ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
</script>
<style>
:root {
    color-scheme: light;
    --bg: #f7f5ef;
    --surface: #fffefb;
    --surface-2: #efece2;
    --code-bg: #f2efe5;
    --ink: #191a17;
    --ink-2: #3b3d37;
    --muted: #686a61;
    --line: #d9d5c7;
    --line-2: #e8e5d9;
    --accent: #2743b8;
    --accent-soft: #e2e7fb;
    --ok: #1a7443;
    --warn: #a35a00;
    --scrollbar: #c2beb0;
    --head-h: 56px;
    --fast: 120ms;
    --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}

:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #101113;
    --surface: #16181b;
    --surface-2: #1d2024;
    --code-bg: #0b0c0e;
    --ink: #d3d1c9;
    --ink-2: #b0aea6;
    --muted: #92958c;
    --line: #2c3035;
    --line-2: #212428;
    --accent: #9db2ff;
    --accent-soft: #1b2346;
    --ok: #72d39c;
    --warn: #f0a85a;
    --scrollbar: #3b4047;
}

* {
    box-sizing: border-box;
}

html {
    -webkit-text-size-adjust: 100%;
    scrollbar-color: var(--scrollbar) transparent;
    scroll-padding-top: calc(var(--head-h) + 16px);
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 19px/1.6 var(--serif);
}

a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
}

/* the bar on top: the name, the repository, the theme */
.head {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    height: var(--head-h);
    padding: 0 24px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    font-family: var(--sans);
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    color: var(--ink);
    font-size: 20px;
    font-weight: 600;
    text-decoration: none;
}

.brand svg {
    flex: none;
    width: 22px;
    height: 26px;
}

.head .grow {
    flex: 1;
}

.head-link,
.theme,
.menu {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: none;
    color: var(--ink);
    font: 15px var(--sans);
    text-decoration: none;
    cursor: pointer;
    transition: background-color var(--fast) ease;
}

.head-link:hover,
.theme:hover,
.menu:hover {
    background: var(--surface-2);
}

.head-link svg {
    width: 18px;
    height: 18px;
    margin-right: 8px;
    fill: currentColor;
}

.theme {
    width: 36px;
    padding: 0;
}

.theme svg {
    width: 20px;
    height: 20px;
}

:root[data-theme="dark"] .theme .sun,
:root:not([data-theme="dark"]) .theme .moon {
    display: none;
}

.menu {
    display: none;
}

/* the pages on the left, the page in the middle */
.layout {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    max-width: 1180px;
    margin: 0 auto;
}

.nav {
    position: sticky;
    top: var(--head-h);
    align-self: start;
    max-height: calc(100vh - var(--head-h));
    overflow-y: auto;
    padding: 24px 16px 40px 24px;
    font: 15px/1.4 var(--sans);
}

.nav h2 {
    margin: 20px 0 8px;
    padding: 16px 10px 0;
    border: 0;
    border-top: 1px solid var(--line);
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.nav h2:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: 0;
}

.nav ul {
    margin: 0;
    padding: 0;
    list-style: none;
}

.nav a {
    display: block;
    padding: 6px 10px;
    border-radius: 6px;
    color: var(--ink);
    font-size: 16px;
    font-weight: 500;
    text-decoration: none;
    overflow-wrap: anywhere;
    transition: background-color var(--fast) ease;
}

.nav a:hover {
    background: var(--surface-2);
}

.nav .current > a {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
}

.nav .toc {
    margin: 4px 0 10px 18px;
    border-left: 2px solid var(--line);
}

.nav .toc a {
    padding: 3px 10px;
    border-radius: 0 6px 6px 0;
    color: var(--muted);
    font-size: 13px;
    font-weight: 400;
}

.nav .toc code {
    font-size: 13px;
}

.main {
    min-width: 0;
    padding: 32px 40px 64px;
}

.doc .main {
    max-width: 860px;
}

/* the text of a doc */
h1,
h2,
h3,
h4 {
    position: relative;
    margin: 1.6em 0 0.5em;
    font-weight: 600;
    line-height: 1.25;
    overflow-wrap: anywhere;
}

h1 {
    margin-top: 0;
    font-size: 40px;
    font-weight: 500;
}

h2 {
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 28px;
}

h3 {
    font-size: 22px;
}

h4 {
    font-size: 19px;
}

.anchor {
    position: absolute;
    left: -0.9em;
    color: var(--muted);
    text-decoration: none;
    opacity: 0;
    transition: opacity var(--fast) ease;
}

h2 .anchor {
    top: 20px;
}

h1:hover .anchor,
h2:hover .anchor,
h3:hover .anchor,
h4:hover .anchor {
    opacity: 1;
}

p,
ul,
ol {
    margin: 0 0 1em;
}

li {
    margin: 0.2em 0;
}

li > ul,
li > ol {
    margin: 0.2em 0;
}

blockquote {
    margin: 0 0 1em;
    padding: 4px 20px;
    border-left: 3px solid var(--line);
    color: var(--ink-2);
}

hr {
    margin: 2em 0;
    border: 0;
    border-top: 1px solid var(--line);
}

code {
    padding: 0.1em 0.3em;
    border-radius: 4px;
    background: var(--code-bg);
    font: 0.8em var(--mono);
    overflow-wrap: anywhere;
}

pre {
    margin: 0 0 1.2em;
    padding: 14px 18px;
    overflow-x: auto;
    border: 1px solid var(--line-2);
    border-radius: 8px;
    background: var(--code-bg);
    font: 14px/1.55 var(--mono);
}

pre code {
    padding: 0;
    background: none;
    font: inherit;
    overflow-wrap: normal;
}

.table-wrap {
    margin: 0 0 1.2em;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 8px;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 16px;
    line-height: 1.45;
}

th,
td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--line-2);
    text-align: left;
    vertical-align: top;
}

th {
    background: var(--surface-2);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
}

tr:last-child td {
    border-bottom: 0;
}

td code {
    overflow-wrap: normal;
    white-space: nowrap;
}

img {
    max-width: 100%;
}

.foot {
    margin-top: 48px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font: 14px var(--sans);
}

/* the front page */
.hero {
    padding: 24px 0 32px;
}

.hero h1 {
    max-width: 18em;
    font-size: 48px;
}

.hero .lede {
    max-width: 34em;
    color: var(--ink-2);
    font-size: 22px;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 24px;
}

.button {
    display: inline-flex;
    align-items: center;
    height: 44px;
    padding: 0 20px;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font: 600 16px var(--sans);
    text-decoration: none;
    transition: background-color var(--fast) ease;
}

.button:hover {
    background: var(--surface-2);
}

.button.main-action {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--bg);
}

.button.main-action:hover {
    background: var(--accent);
    opacity: 0.9;
}

.flow {
    margin: 8px 0 40px;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
}

.flow svg {
    display: block;
    width: 100%;
    height: auto;
}

.flow .box {
    fill: var(--surface-2);
    stroke: var(--line);
}

.flow .box.accent {
    fill: var(--accent-soft);
    stroke: var(--accent);
}

.flow .label {
    fill: var(--ink);
    font: 600 17px var(--sans);
}

.flow .note {
    fill: var(--muted);
    font: 14px var(--sans);
}

.flow .arrow {
    fill: none;
    stroke: var(--muted);
    stroke-width: 2;
}

.flow .arrow.accent {
    stroke: var(--accent);
}

.flow .dot-ok {
    fill: var(--ok);
}

.flow .dot-warn {
    fill: var(--warn);
}

.flow .dot-off {
    fill: var(--muted);
}

.kinds,
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    margin: 0 0 1.2em;
}

.kind,
.card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    text-decoration: none;
    overflow-wrap: anywhere;
}

.kind span,
.card span {
    color: var(--ink-2);
    font-size: 17px;
    line-height: 1.45;
}

.card {
    transition: border-color var(--fast) ease;
}

.card:hover {
    border-color: var(--accent);
}

.card strong {
    color: var(--accent);
    font: 600 17px var(--sans);
}

.kind code {
    align-self: flex-start;
    font-size: 15px;
}

.shot {
    margin: 0 0 1.2em;
}

.shot img {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
}

.shot figcaption {
    margin-top: 8px;
    color: var(--muted);
    font: 14px var(--sans);
}

/* the control page in the theme the site is in */
:root[data-theme="dark"] .shot .light,
:root:not([data-theme="dark"]) .shot .dark {
    display: none;
}

/* a phone: the pages fold under a button */
@media (max-width: 860px) {
    body {
        font-size: 18px;
    }

    .head {
        padding: 0 16px;
    }

    .head-link span {
        display: none;
    }

    .head-link svg {
        margin-right: 0;
    }

    .menu {
        display: flex;
    }

    .layout {
        display: block;
    }

    .nav {
        display: none;
        position: static;
        max-height: none;
        padding: 16px;
        border-bottom: 1px solid var(--line);
    }

    .nav-open .nav {
        display: block;
    }

    .main {
        padding: 24px 16px 48px;
    }

    h1 {
        font-size: 32px;
    }

    h2 {
        font-size: 24px;
    }

    .hero h1 {
        font-size: 34px;
    }

    .hero .lede {
        font-size: 19px;
    }

    /* the diagram keeps its words readable and scrolls sideways */
    .flow {
        overflow-x: auto;
        padding: 12px;
    }

    .flow svg {
        width: 640px;
        max-width: none;
    }

    .anchor {
        display: none;
    }
}
</style>
</head>

<script>
    // one button showing the theme now: the sun in Light, the crescent in Dark; a click goes to the other
    function theme_show(name)
    {
        const button = document.getElementById('theme');
        document.documentElement.dataset.theme = name;
        button.setAttribute('aria-label', (name === 'dark') ? 'Dark theme. Switch to light theme.' : 'Light theme. Switch to dark theme.');
        button.title = button.getAttribute('aria-label');
    }

    function theme_set(name)
    {
        theme_show(name);
        try {
            localStorage.setItem('serviceman-docs-theme', name);
        }
        catch (error) {
            // a private window keeps the theme for this page only
        }
    }

    document.addEventListener('click', function (event) {
        if (event.target.closest('#theme')) {
            theme_set((document.documentElement.dataset.theme === 'dark') ? 'light' : 'dark');
            return;
        }
        if (event.target.closest('#menu')) {
            const open = document.body.classList.toggle('nav-open');
            document.getElementById('menu').setAttribute('aria-expanded', String(open));
            return;
        }
        if (event.target.closest('.nav a')) {
            document.body.classList.remove('nav-open');
            document.getElementById('menu').setAttribute('aria-expanded', 'false');
        }
    });

    theme_show(document.documentElement.dataset.theme);
</script>
