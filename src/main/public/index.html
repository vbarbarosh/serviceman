<script>
// Storage that throws, in a private window or with site data blocked, is a choice not kept
function kept(name) {
    try {
        return localStorage.getItem(name);
    }
    catch {
        return null;
    }
}
document.documentElement.dataset.theme = (kept('serviceman.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
// The chosen skin goes on before the first paint, after serviceman.css so it overrides it
(function () {
    const skin = kept('serviceman.skin');
    if ((skin === null) || (skin === '')) {
        return;
    }
    const link = document.createElement('link');
    link.id = 'skin-css';
    link.rel = 'stylesheet';
    link.href = `/skins/${encodeURIComponent(skin)}/skin.css`;
    document.head.appendChild(link);
}());
</script>
