server {
    listen 80;
    server_name _;

    # ClickHouse is looked up by name again every 10 seconds, through Docker's own DNS. A name
    # in proxy_pass is looked up once, when nginx starts: ClickHouse started again with a new
    # address left every query failing with 502 until this container was restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $clickhouse clickstack;

    root /usr/share/nginx/html;
    index index.html;

    # This UI is edited through bind mounts during local development. Never
    # cache its small assets, otherwise a browser can keep an older interface.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /styles.css {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /app.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy for parameterized, read-only queries generated by the UI.
    # The service is bound to 127.0.0.1 in Compose; it is not intended for an
    # untrusted network because the ClickHouse default user has broad access.
    location /clickhouse {
        limit_except POST { deny all; }
        rewrite ^/clickhouse/?(.*)$ /$1 break;
        proxy_pass http://$clickhouse:8123;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_set_header Connection "";
        # Do not forward credentials or let an upstream authentication
        # challenge open a browser-native username/password dialog.
        proxy_set_header Authorization "";
        proxy_set_header X-ClickHouse-User "log_ui";
        proxy_set_header X-ClickHouse-Key "";
        proxy_hide_header WWW-Authenticate;
    }
}
